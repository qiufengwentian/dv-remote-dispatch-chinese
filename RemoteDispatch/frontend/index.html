<!DOCTYPE html>
<html>
<head>
	<title>Derail Valley 远程调度控制台</title>
	<link rel="icon" href="res/icon.svg">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.7.1/dist/leaflet.css" integrity="sha256-BPfK9M5v34c2XP6p0cxVz1mUQLst0gTLk0mlc7kuodA=" crossorigin="anonymous">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet-sidebar-v2@3.2.3/css/leaflet-sidebar.min.css" integrity="sha256-10dwwxs/pdWEYoC56aJvmY3kbMMa9/3uSWWNkGcrGq8=" crossorigin="anonymous">
	<link rel="stylesheet" href="res/style.css">
	<script src="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@5.15.4/js/all.min.js" integrity="sha256-gSqw5G+Gss6YqyQlqyIkuQ0IRZUqGsDVq9c0tiF+mL8=" crossorigin="anonymous"></script>
	<script src="https://cdn.jsdelivr.net/npm/leaflet@1.7.1/dist/leaflet-src.js" integrity="sha256-dG7rUAec0UN0e3nlMEuYJzsbK0rpoz4hBbNp0ir9iF8=" crossorigin="anonymous"></script>
	<script src="res/leaflet.rotatedImageOverlay.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/leaflet-sidebar-v2@3.2.3/js/leaflet-sidebar.min.js" integrity="sha256-4r81BYKeNxSG+nrK/UPQq75pDlH+GkiZn/zc/xkNMLA=" crossorigin="anonymous"></script>
	<script src="https://cdn.jsdelivr.net/npm/@zerowastemap/leaflet.zoomhome@1.0.0/index.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/tablesort@5.2.1/src/tablesort.js" integrity="sha256-ams/0yjSE7HGIRWB/A3VtW3Z24eOT+5z0z9d1pms7T4=" crossorigin="anonymous"></script>
</head>
<body>
	<div id="sidebar" class="leaflet-sidebar collapsed">
		<div class="leaflet-sidebar-tabs">
			<ul role="tablist">
				<li><a href="#carsTab" role="tab"><i class="fas fa-train" title="车辆"></i></a></li>
				<li><a href="#locoFilterTab" role="tab"><i class="fas fa-eye" title="选择机车"></i></a></li>
				<li><a href="#jobsTab" role="tab"><i class="fas fa-clipboard-list" title="任务"></i></a></li>
				<li><a href="#locoControlTab" role="tab"><i class="fas fa-gamepad" title="机车操控"></i></a></li>
				<li><a href="#settingsTab" role="tab"><i class="fas fa-cog" title="设置"></i></a></li>
				<li><a href="#signals-sidebar" role="tab"><i class="fas fa-traffic-light" title="信号机"></i></a></li>
			</ul>
		</div>
		<div class="leaflet-sidebar-content">
			<div class="leaflet-sidebar-pane" id="carsTab">
				<h1 class="leaflet-sidebar-header">
					机车车辆
					<span class="leaflet-sidebar-close"><i class="fa fa-caret-left"></i></span>
				</h1>
				<table id="carList">
					<thead>
						<tr><th>ID</th><th>任务</th><th>目的地</th></tr>
					</thead>
					<tbody id="carListBody"></tbody>
				</table>
			</div>
			<div class="leaflet-sidebar-pane" id="locoFilterTab">
				<h1 class="leaflet-sidebar-header">
					机车可见性
					<span class="leaflet-sidebar-close"><i class="fa fa-caret-left"></i></span>
				</h1>
				<table id="locoList">
					<thead>
						<tr><th>ID</th><th>高亮</th></tr>
					</thead>
					<tbody id="locoListBody"></tbody>
				</table>
			</div>
			<div class="leaflet-sidebar-pane" id="jobsTab">
				<h1 class="leaflet-sidebar-header">
					任务
					<span class="leaflet-sidebar-close"><i class="fa fa-caret-left"></i></span>
				</h1>
				<input id="jobSearchText" type="text" placeholder="搜索…">
				<label>仅进行中<input id="jobActiveOnly" type="checkbox"></label>
				<table id="jobList">
					<tbody id="jobListBody"></tbody>
				</table>
			</div>
			<div class="leaflet-sidebar-pane" id="locoControlTab">
				<h1 class="leaflet-sidebar-header">
					机车操控
					<span class="leaflet-sidebar-close"><i class="fa fa-caret-left"></i></span>
				</h1>
				<div id="locoControlIndicators">
					<label for="locoControlLocoId">L-</label>
					<select id="locoControlLocoId"></select>
					<span id="locoControlBrakePipe"></span> bar
					<span id="locoControlForwardSpeed"></span> km/h
				</div>
				<div id="locoControlControls">
					<div>
						<label for="locoControlTrainBrakeInput">列车制动</label>
						<input id="locoControlTrainBrakeInput" type="range">
					</div>
					<div>
						<label for="locoControlIndependentBrakeInput">独立制动</label>
						<input id="locoControlIndependentBrakeInput" type="range">
					</div>
					<div>
						<label>换向</label>
						<span id="locoControlReverserReverseButton" class="locoControlButton" locoControlCommand="reverse"><i class="far fa-play-circle fa-flip-horizontal" title="后退"></i></span>
						<span id="locoControlReverserForwardButton" class="locoControlButton" locoControlCommand="forward"><i class="far fa-play-circle" title="前进"></i></span>
					</div>
					<div>
						<label for="locoControlThrottleInput">油门</label>
						<input id="locoControlThrottleInput" type="range">
					</div>
					<div>
						<button id="locoControlCoupleButton">连挂</button>
					</div>
					<div>
						<button id="locoControlUncoupleButton">摘解</button>
						<select id="locoControlUncoupleSelect"></select>
					</div>
				</div>
			</div>
			<div class="leaflet-sidebar-pane" id="signals-sidebar">
				<h1 class="leaflet-sidebar-header">
					信号机
					<span class="leaflet-sidebar-close"><i class="fa fa-caret-left"></i></span>
				</h1>
				<div id="signals-sidebar-content">
					<!-- Populated by buildSignalsSidebar() after signalsReady resolves -->
				</div>
			</div>
			<div class="leaflet-sidebar-pane" id="settingsTab">
				<h1 class="leaflet-sidebar-header">
					设置
					<span class="leaflet-sidebar-close"><i class="fa fa-caret-left"></i></span>
				</h1>
				<table>
					<tr>
						<th><label for="themeDropdown">主题</label></th>
						<td>
							<select name="theme" id="themeDropdown">
								<option value="dark">深色</option>
								<option value="light">浅色</option>
							</select>
						</td>
					</tr>
					<tr>
						<th><label for="carColorDropdown">车辆颜色</label></th>
						<td>
							<select name="carColor" id="carColorDropdown">
								<option value="jobId">按任务 ID</option>
								<option value="jobType">按任务类型</option>
								<option value="destination">按目的地</option>
								<option value="carType">按车种</option>
							</select>
						</td>
					</tr>
					<tr>
						<th><label for="playerScalingCheckbox">玩家图标缩放</label></th>
						<td><input type="checkbox" id="playerScalingCheckbox" checked></td>
					</tr>
					<tr>
						<th><label for="playerNameCheckbox">显示玩家名</label></th>
						<td><input type="checkbox" id="playerNameCheckbox" checked></td>
					</tr>
				</table>
			</div>
		</div>
	</div>
	<div id="map" class="dark" style="height:100vh"></div>
	<div id="search">
		<input id="searchInput" type="text" placeholder="跳转到…" autocomplete="off">
		<ul id="searchResults"></ul>
	</div>
	<script src="res/main.js"></script>
</body>
</html>
